spring:
  application:
    name: SIMULENEM-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  servlet:
    context-path: /api/v1/
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs.html
    operations-sorter: group

cloud:
  aws:
    s3:
      endpointUrl: http://localhost:4566
      bucketName: my-image-bucket
    credentials:
      accessKey: test
      secretKey: test
    region:
      static: us-east-1
    stack:
      auto: false
