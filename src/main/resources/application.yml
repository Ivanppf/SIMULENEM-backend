spring:
  application:
    name: SIMULENEM-backend
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:simulenem
    username: sa
    password: password
  h2:
    console:
      enabled: true
server:
  servlet:
    context-path: /api/v1/

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs.html
    operations-sorter: group